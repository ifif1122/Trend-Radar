[project]
name = "trend-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
trend-radar = "trend_radar.__main__:main"
